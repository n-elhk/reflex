<ion-content fullscreen [scrollY]="false" forceOverscroll="false">
  <!-- Fond animé -->
  <div class="bg">
    <span #blob class="blob b1"></span>
    <span #blob class="blob b2"></span>
    <span #blob class="blob b3"></span>
    <span #blob class="blob b4"></span>
    <span #blob class="blob b5"></span>
    <span #blob class="blob b6"></span>
  </div>

  <!-- Hero -->
  <section class="container">
    <div #hero class="hero">
      <h1 class="title">REFLEX</h1>
      <!-- <p class="tagline">Concentration ⚡ Réflexes ⚡ Instantané</p> -->
    </div>

    <!-- CTA principal -->
    <div class="cta">
      <ion-button #stagger #ctaPlay expand="block" size="large" class="cta-play" (click)="onPlay()">
        <ion-icon name="flash-outline" slot="start"></ion-icon>
        Jouer
      </ion-button>

      <div class="grid">
        <ion-button #stagger expand="block" fill="outline" class="btn-secondary">
          <ion-icon name="speedometer-outline" slot="start"></ion-icon>
          Entraînement
        </ion-button>
        <ion-button #stagger expand="block" fill="outline" class="btn-secondary">
          <ion-icon name="trophy-outline" slot="start"></ion-icon>
          Classements
        </ion-button>
        <ion-button #stagger expand="block" fill="outline" class="btn-secondary">
          <ion-icon name="settings-outline" slot="start"></ion-icon>
          Paramètres
        </ion-button>
      </div>
    </div>

    <!-- Bandeau infos -->
    <!-- <div #stagger class="infos">
      <ion-icon name="time-outline"></ion-icon>
      <span>Parties de 30–60 secondes. Parfaites pour les pauses.</span>
    </div> -->
  </section>
