<ion-content [fullscreen]="true" [scrollY]="false">
  <!-- Zone de jeu -->
  <div
    appGameArea
    class="game-area"
    [class.over]="isOver()"
    [class.move-right]="movementDirection() === 'right'"
    [class.move-left]="movementDirection() === 'left'"
    [class.move-up]="movementDirection() === 'up'"
    [class.move-down]="movementDirection() === 'down'"
    [style.--speed]="speedCss()"
  >
    <div class="lines">
      @for (line of lines; let lineIndex = $index; track lineIndex) {
      <div class="line">
        @for (spritIndex of sprites; track spritIndex) {
        <div
          class="sprite"
          [style.animationDelay.ms]="delayMs(spritIndex, lineIndex)"
        >
          <div class="sprite-inner">
            <ion-icon [name]="iconName()" />
          </div>
        </div>
        }
      </div>
      }
    </div>

    @if (isOver()) {
    <div class="overlay">
      <h1>Game Over</h1>
      <p>Score {{ score() }} — Record {{ bestScore() }}</p>
      <ion-button fill="solid" (click)="restart()">Rejouer</ion-button>
    </div>
    }
  </div>

  @let countdownValue = countdown(); @if(countdownValue){

  <ion-progress-bar
    color="primary"
    [value]="countdownValue.remaining / countdownValue.duration"
    [buffer]="1"
  />
  }

  <ion-footer
    class="color-banner"
    [class.green]="isMovmentRound()"
    [class.red]="!isMovmentRound()"
  >
    <div>{{ helpText() }}</div>
  </ion-footer>
</ion-content>
